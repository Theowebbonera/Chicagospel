<style>#chicago-diag{position:fixed;left:0;right:0;bottom:0;max-height:65%;overflow:auto;background:rgba(30,6,6,0.94);color:#fff;font:13px/1.45 monospace;padding:10px 12px;z-index:99999;display:none;white-space:pre-wrap;border-top:2px solid #f3c45b}#chicago-diag b{color:#f3c45b}</style>
<script>
(function () {
  var NL = String.fromCharCode(10);
  var logg = [];
  function info() {
    var s = 'Chicago – felsökning (ta en skärmdump och skicka)' + NL + navigator.userAgent + NL;
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl2');
      s += 'WebGL2: ' + (gl ? 'ja' : 'NEJ – spelet kräver WebGL 2') + NL;
      if (gl) {
        var vill = ['EXT_color_buffer_float', 'EXT_color_buffer_half_float', 'OES_texture_float_linear', 'WEBGL_compressed_texture_etc', 'WEBGL_compressed_texture_astc', 'WEBGL_compressed_texture_s3tc', 'WEBGL_compressed_texture_etc1'];
        var finns = gl.getSupportedExtensions() || [];
        var saknas = vill.filter(function (x) { return finns.indexOf(x) < 0; });
        s += 'Saknade tillägg: ' + (saknas.length ? saknas.join(', ') : 'inga') + NL;
        s += 'Största textur: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + NL;
      }
    } catch (e) { s += 'WebGL-test gav fel: ' + e + NL; }
    try {
      if (window.Engine && Engine.getMissingFeatures) {
        var m = Engine.getMissingFeatures();
        s += 'Godot saknar: ' + (m && m.length ? m.join(', ') : 'inget') + NL;
      }
    } catch (e) { s += 'getMissingFeatures gav fel: ' + e + NL; }
    s += 'Skärm: ' + screen.width + 'x' + screen.height + ', fönster ' + innerWidth + 'x' + innerHeight + ', dpr ' + devicePixelRatio + NL;
    s += 'Minne (WebAssembly): ' + (typeof WebAssembly === 'object' ? 'ja' : 'NEJ') + NL;
    return s;
  }
  function visa() {
    var d = document.getElementById('chicago-diag');
    if (!d) {
      if (!document.body) { return; }
      d = document.createElement('div');
      d.id = 'chicago-diag';
      document.body.appendChild(d);
      d.addEventListener('click', function () { d.style.display = 'none'; });
    }
    d.style.display = 'block';
    d.textContent = info() + NL + 'Fel och meddelanden:' + NL + (logg.length ? logg.join(NL) : '(inga)') + NL + NL + '(tryck för att stänga)';
  }
  window.chicagoDiag = visa;
  window.addEventListener('error', function (e) { logg.push('Fel: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); visa(); });
  window.addEventListener('unhandledrejection', function (e) { logg.push('Promise: ' + (e.reason && (e.reason.message || e.reason))); visa(); });
  var ce = console.error;
  console.error = function () { try { logg.push([].slice.call(arguments).join(' ')); } catch (x) {} return ce.apply(console, arguments); };
  var cw = console.warn;
  console.warn = function () { try { logg.push('Varning: ' + [].slice.call(arguments).join(' ')); } catch (x) {} return cw.apply(console, arguments); };
  // spelet sätter window.chicagoStartad när det är igång
  setTimeout(function () { if (!window.chicagoStartad) { logg.push('Spelet har inte startat efter 30 sekunder.'); visa(); } }, 30000);
  if (/diag=1/.test(location.search)) { setTimeout(visa, 4000); }
  // mobil: be om fullskärm och liggande läge vid första trycket (måste ske i själva trycket)
  if (/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent)) {
    var forsta = function () {
      document.removeEventListener('touchend', forsta, true);
      document.removeEventListener('click', forsta, true);
      try {
        var el = document.documentElement;
        var f = el.requestFullscreen || el.webkitRequestFullscreen;
        if (f) { var r = f.call(el); if (r && r.catch) { r.catch(function () {}); } }
      } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); } } catch (e) {}
    };
    document.addEventListener('touchend', forsta, true);
    document.addEventListener('click', forsta, true);
  }
})();
</script>
