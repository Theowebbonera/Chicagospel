<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Chicago</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>#chicago-diag{position:fixed;left:0;right:0;bottom:0;max-height:65%;overflow:auto;background:rgba(30,6,6,0.94);color:#fff;font:13px/1.45 monospace;padding:10px 12px;z-index:99999;display:none;white-space:pre-wrap;border-top:2px solid #f3c45b}#chicago-diag b{color:#f3c45b}</style>
<script>
(function () {
  var NL = String.fromCharCode(10);
  var logg = [];
  function info() {
    var s = 'Chicago – felsökning (ta en skärmdump och skicka)' + NL + navigator.userAgent + NL;
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl2');
      s += 'WebGL2: ' + (gl ? 'ja' : 'NEJ – spelet kräver WebGL 2') + NL;
      if (gl) {
        var vill = ['EXT_color_buffer_float', 'EXT_color_buffer_half_float', 'OES_texture_float_linear', 'WEBGL_compressed_texture_etc', 'WEBGL_compressed_texture_astc', 'WEBGL_compressed_texture_s3tc', 'WEBGL_compressed_texture_etc1'];
        var finns = gl.getSupportedExtensions() || [];
        var saknas = vill.filter(function (x) { return finns.indexOf(x) < 0; });
        s += 'Saknade tillägg: ' + (saknas.length ? saknas.join(', ') : 'inga') + NL;
        s += 'Största textur: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + NL;
      }
    } catch (e) { s += 'WebGL-test gav fel: ' + e + NL; }
    try {
      if (window.Engine && Engine.getMissingFeatures) {
        var m = Engine.getMissingFeatures();
        s += 'Godot saknar: ' + (m && m.length ? m.join(', ') : 'inget') + NL;
      }
    } catch (e) { s += 'getMissingFeatures gav fel: ' + e + NL; }
    s += 'Skärm: ' + screen.width + 'x' + screen.height + ', fönster ' + innerWidth + 'x' + innerHeight + ', dpr ' + devicePixelRatio + NL;
    s += 'Minne (WebAssembly): ' + (typeof WebAssembly === 'object' ? 'ja' : 'NEJ') + NL;
    return s;
  }
  function visa() {
    var d = document.getElementById('chicago-diag');
    if (!d) {
      if (!document.body) { return; }
      d = document.createElement('div');
      d.id = 'chicago-diag';
      document.body.appendChild(d);
      d.addEventListener('click', function () { d.style.display = 'none'; });
    }
    d.style.display = 'block';
    d.textContent = info() + NL + 'Fel och meddelanden:' + NL + (logg.length ? logg.join(NL) : '(inga)') + NL + NL + '(tryck för att stänga)';
  }
  window.chicagoDiag = visa;
  window.addEventListener('error', function (e) { logg.push('Fel: ' + (e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')); visa(); });
  window.addEventListener('unhandledrejection', function (e) { logg.push('Promise: ' + (e.reason && (e.reason.message || e.reason))); visa(); });
  var ce = console.error;
  console.error = function () { try { logg.push([].slice.call(arguments).join(' ')); } catch (x) {} return ce.apply(console, arguments); };
  var cw = console.warn;
  console.warn = function () { try { logg.push('Varning: ' + [].slice.call(arguments).join(' ')); } catch (x) {} return cw.apply(console, arguments); };
  // spelet sätter window.chicagoStartad när det är igång
  setTimeout(function () { if (!window.chicagoStartad) { logg.push('Spelet har inte startat efter 30 sekunder.'); visa(); } }, 30000);
  if (/diag=1/.test(location.search)) { setTimeout(visa, 4000); }
  // mobil: be om fullskärm och liggande läge vid första trycket (måste ske i själva trycket)
  if (/iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent)) {
    var forsta = function () {
      document.removeEventListener('touchend', forsta, true);
      document.removeEventListener('click', forsta, true);
      try {
        var el = document.documentElement;
        var f = el.requestFullscreen || el.webkitRequestFullscreen;
        if (f) { var r = f.call(el); if (r && r.catch) { r.catch(function () {}); } }
      } catch (e) {}
      try { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); } } catch (e) {}
    };
    document.addEventListener('touchend', forsta, true);
    document.addEventListener('click', forsta, true);
  }
})();
</script>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2395712,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
